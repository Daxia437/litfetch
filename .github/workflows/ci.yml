name: ci

# Two claims in the README are machine-checked here, because both were once
# aspirational prose: "runs on macOS, Linux and Windows with Python 3.9+" and
# "CI repeats the no-extras check". The second job is the important one -- if
# `core` ever grows a hard dependency, this fails on the same commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:
          # macOS runners are arm64 and their tool cache has no 3.9 build, so
          # setup-python fails before any code runs. 3.9 stays covered on Linux
          # and Windows -- which is still a real claim, tested rather than
          # asserted. Drop the version entirely if it ever stops being true.
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install with all extras
        run: python -m pip install -e ".[all]"
      - name: Test suite
        run: python tests/run_tests.py
      - name: Doctor exits 0 when only optional extras are missing
        run: litfetch doctor

  no-extras:
    name: core stays standard library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install with no extras
        run: python -m pip install -e .
      - name: Tests (modules that need an extra skip themselves)
        run: python tests/run_tests.py
      - name: Import the package without pymupdf, curl_cffi or websocket-client
        run: python -c "import litfetch, litfetch.core.verify, litfetch.core.store, litfetch.core.audit, litfetch.core.report, litfetch.core.select; print(litfetch.__version__)"
      - name: Doctor reports the missing PDF backend and exits 2
        run: |
          if litfetch doctor; then
            echo "::error::doctor should exit 2 without a PDF backend"
            exit 1
          else
            code=$?
            test "$code" -eq 2 || { echo "::error::expected 2, got $code"; exit 1; }
          fi

  package:
    name: sdist and wheel build clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/litfetch --version
      - name: The skill ships inside the wheel and matches the CLI version
        run: /tmp/clean/bin/litfetch skill --print > /tmp/SKILL.md && test -s /tmp/SKILL.md
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
